name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m compileall -q .agents/skills scripts
      - run: python scripts/smoke_test.py
      - run: python .agents/skills/abstract-kickoff/scripts/run_abstract.py examples/demo-drug-decay --skip-intake --strict
